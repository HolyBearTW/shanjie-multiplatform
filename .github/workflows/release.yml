name: release

# 先建置及驗證所有指定平台，附件完整後才公開 Release；同來源草稿可安全續作。
on:
  push:
    branches: [main]
    paths: [windows/Cargo.toml]
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: build and run RELEASE acceptance; publish: create or resume a same-source draft'
        type: choice
        default: verify
        options: [verify, publish]
      pipeline:
        description: 'parallel: sealed snapshot with cross-job evidence; legacy: original single Windows job'
        type: choice
        default: parallel
        options: [parallel, legacy]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build_linux: ${{ steps.release.outputs.build_linux }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Plan the release without publishing
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish' }}
        run: |
          flags=()
          if [ "$VERIFY_ONLY" = "true" ]; then flags=(--verify); fi
          python3 scripts/release.py plan "${flags[@]}"

  windows:
    needs: release
    if: github.event_name == 'workflow_dispatch' && inputs.pipeline == 'legacy'
    # Match the Visual Studio 2026 generator selected by the CMake presets.
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    outputs:
      artifact_name: windows-package-${{ github.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 (Node.js 24)
        with:
          dotnet-version: 10.0.x
      - name: Identify Windows Cargo cache keys
        id: cargo-cache-key
        env:
          SHANJIE_CARGO_CACHE_INPUTS: ${{ hashFiles('.cargo/windows-release-x64.toml', 'windows/Cargo.*', 'windows/src/**', 'windows/build.rs', 'windows/*.rc', 'shared/Cargo.*', 'shared/src/**', 'UPSTREAM.json', 'platform/**', 'scripts/prepare-*.ps1', 'assets/mode/**', 'ui/Assets/**', 'ui/Themes/Sj.xaml', 'profiles/**', 'data/model-v6-classes-v4.json') }}
        run: pwsh -NoProfile -File scripts/cargo-cache-key.ps1 -Profile release
      - name: Cache Cargo registry downloads
        id: cache-cargo-registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('windows/Cargo.lock', 'shared/Cargo.toml', 'upstream/shanjie/core/Cargo.toml') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-
      - name: Cache Windows host Cargo compilation outputs
        id: cache-cargo-host
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          # prepare-core rechecks the source receipt after the archive is restored.
          path: |
            build/core/.prepare-cache.json
            build/core/Cargo.toml
            build/core/src
            windows/target/release
          key: ${{ steps.cargo-cache-key.outputs.prefix }}-host-${{ runner.arch }}-${{ steps.cargo-cache-key.outputs.inputs }}
          restore-keys: ${{ steps.cargo-cache-key.outputs.prefix }}-host-${{ runner.arch }}-
      - name: Cache Windows x64 Cargo compilation outputs
        id: cache-cargo-x64
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: |
            shared/target
            windows/target/x86_64-pc-windows-msvc/release
          key: ${{ steps.cargo-cache-key.outputs.x64_prefix }}-x86_64-pc-windows-msvc-${{ steps.cargo-cache-key.outputs.inputs }}
          # Cargo revalidates restored artifacts within the same target, toolchain and profile.
          restore-keys: ${{ steps.cargo-cache-key.outputs.x64_prefix }}-x86_64-pc-windows-msvc-
      - name: Cache Windows x86 Cargo compilation outputs
        id: cache-cargo-x86
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: windows/target/i686-pc-windows-msvc/release
          key: ${{ steps.cargo-cache-key.outputs.prefix }}-i686-pc-windows-msvc-${{ steps.cargo-cache-key.outputs.inputs }}
          restore-keys: ${{ steps.cargo-cache-key.outputs.prefix }}-i686-pc-windows-msvc-
      - name: Cache NuGet packages
        id: cache-nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: ~/.nuget/packages
          key: windows-nuget-${{ hashFiles('NuGet.Config', 'ui/Shanjie.UI.csproj') }}
          restore-keys: windows-nuget-
      - name: Cache Windows model sources and conversion output
        id: cache-models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          # prepare-models verifies pinned sources and the conversion receipt on every run.
          path: |
            build/model
            dist/data/models/builtin
          key: windows-models-v1-${{ hashFiles('MODEL-SOURCES.json') }}-${{ steps.cargo-cache-key.outputs.toolchain }}-${{ hashFiles('UPSTREAM.json', '.cargo/config.toml', 'platform/**/*', 'scripts/prepare-core.ps1', 'scripts/prepare-models.ps1') }}
          restore-keys: windows-models-v1-${{ hashFiles('MODEL-SOURCES.json') }}-
      - name: Cache upstream core test builds and passing receipts
        id: cache-core-suite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          # Keep Cargo fingerprints together with the verified generated inputs.
          # test-core checks each executable and the retained test logs before beta reuse.
          path: |
            build/test/core/.source-cache.json
            build/test/core/Cargo.lock
            build/test/core/Cargo.toml
            build/test/core/src
            build/test/core/tests
            build/test/core/target
            build/test/passed-heavy
          key: windows-core-suite-v2-${{ steps.cargo-cache-key.outputs.toolchain }}-${{ steps.cargo-cache-key.outputs.native }}-${{ hashFiles('UPSTREAM.json', 'MODEL-SOURCES.json', '.cargo/config.toml', 'platform/**/*', 'scripts/prepare-core.ps1', 'scripts/test-core.ps1', 'scripts/test-support.psm1') }}
          restore-keys: windows-core-suite-v2-${{ steps.cargo-cache-key.outputs.toolchain }}-${{ steps.cargo-cache-key.outputs.native }}-
      - name: Collect runner environment diagnostics
        env:
          CACHE_HIT_REGISTRY: ${{ steps.cache-cargo-registry.outputs.cache-hit == 'true' }}
          CACHE_HIT_HOST: ${{ steps.cache-cargo-host.outputs.cache-hit == 'true' }}
          CACHE_HIT_X64: ${{ steps.cache-cargo-x64.outputs.cache-hit == 'true' }}
          CACHE_HIT_X86: ${{ steps.cache-cargo-x86.outputs.cache-hit == 'true' }}
          CACHE_HIT_NUGET: ${{ steps.cache-nuget.outputs.cache-hit == 'true' }}
          CACHE_HIT_MODELS: ${{ steps.cache-models.outputs.cache-hit == 'true' }}
          CACHE_HIT_CORE: ${{ steps.cache-core-suite.outputs.cache-hit == 'true' }}
        run: |
          $cacheSpec = @{
            cargo_registry = @{ hit = $env:CACHE_HIT_REGISTRY; paths = @('~/.cargo/registry/index', '~/.cargo/registry/cache', '~/.cargo/registry/src') }
            cargo_host = @{ hit = $env:CACHE_HIT_HOST; paths = @('build/core/.prepare-cache.json', 'build/core/Cargo.toml', 'build/core/src', 'windows/target/release') }
            cargo_x64 = @{ hit = $env:CACHE_HIT_X64; paths = @('shared/target', 'windows/target/x86_64-pc-windows-msvc/release') }
            cargo_x86 = @{ hit = $env:CACHE_HIT_X86; paths = @('windows/target/i686-pc-windows-msvc/release') }
            nuget = @{ hit = $env:CACHE_HIT_NUGET; paths = @('~/.nuget/packages') }
            models = @{ hit = $env:CACHE_HIT_MODELS; paths = @('build/model', 'dist/data/models/builtin') }
            core_suite = @{ hit = $env:CACHE_HIT_CORE; paths = @('build/test/core/target', 'build/test/passed-heavy') }
          } | ConvertTo-Json -Depth 4 -Compress
          pwsh -NoProfile -File scripts/runner-diagnostics.ps1 -Phase pre -RunnerLabel windows-2025-vs2026 -TestLevel RELEASE -Jobs 4 -CacheSpecJson $cacheSpec
      - name: Run CTest RELEASE (interactive UI rows are reported as not run)
        # G05 is a manual special test, outside beta/stable/manual RELEASE sets.
        run: pwsh -File scripts/test.ps1 -Level RELEASE -BaseRef HEAD -CiSafe
      - name: Record runner performance diagnostics
        if: always()
        run: pwsh -NoProfile -File scripts/runner-diagnostics.ps1 -Phase post -RunnerLabel windows-2025-vs2026 -TestLevel RELEASE -Jobs 4
      - name: Upload CTest reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: windows-ctest-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/**
            build/test/passed-heavy/*.json
            build/test/core/target/test-logs/*.txt*
            build/cmake/windows-x64/Testing/Temporary/LastTest.log
            build/cmake/windows-x86/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare verified release assets
        run: |
          foreach ($name in @('Shanjie-Windows-Setup.exe')) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "dist/$name.sha256" "$hash  $name" -Encoding utf8NoBOM
          }
          python scripts/release.py manifest --platform windows --folder dist
          if ($LASTEXITCODE) { throw 'Release artifact manifest failed.' }
      - name: Build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: windows-package-${{ github.run_attempt }}
          path: |
            dist/Shanjie-Windows-Setup.exe
            dist/Shanjie-Windows-Setup.exe.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7

  build-x64:
    name: Build x64
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.pipeline != 'legacy'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-build-x64-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: build
          architecture: x64
      - name: Build x64, WinUI and shared data
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Build -Architecture x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/build-x64.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  build-x86:
    name: Build x86
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.pipeline != 'legacy'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-build-x86-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: build
          architecture: x86
      - name: Build x86 product and recovery probe
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Build -Architecture x86
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/build-x86.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  prepare-core:
    name: Prepare Core Test Binaries
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.pipeline != 'legacy'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-core-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: core
      - name: Compile all upstream core executables once, without running assertions
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase PrepareCore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-core-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/core-bundle.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  seal:
    name: Seal Release Snapshot
    needs: [build-x64, build-x86, prepare-core]
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    outputs:
      snapshot_id: ${{ steps.seal.outputs.snapshot_id }}
      snapshot_sha256: ${{ steps.seal.outputs.snapshot_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-x64.outputs.artifact }}
          path: build/parallel/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-x86.outputs.artifact }}
          path: build/parallel/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.prepare-core.outputs.artifact }}
          path: build/parallel/transfer
      - name: Extract build artifacts
        run: |
          tar -xf build/parallel/transfer/build-x64.tar
          if ($LASTEXITCODE) { throw 'x64 extraction failed.' }
          tar -xf build/parallel/transfer/build-x86.tar
          if ($LASTEXITCODE) { throw 'x86 extraction failed.' }
          tar -xf build/parallel/transfer/core-bundle.tar -C build/parallel
          if ($LASTEXITCODE) { throw 'Core bundle extraction failed.' }
      - name: Verify source receipts and seal common snapshot
        id: seal
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-snapshot-${{ steps.seal.outputs.snapshot_id }}
          path: build/parallel/snapshot.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Verify ${{ matrix.architecture }}
    needs: seal
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        architecture: [x64, x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: verify
          architecture: ${{ matrix.architecture }}
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - name: Execute complete architecture CTest inventory except delegated core and package rows
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Verify -Architecture '${{ matrix.architecture }}' -SnapshotId '${{ needs.seal.outputs.snapshot_id }}' -SnapshotHash '${{ needs.seal.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-verify-${{ needs.seal.outputs.snapshot_id }}-${{ matrix.architecture }}
          path: build/parallel/verify-${{ matrix.architecture }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed verification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-verify-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  core-tests:
    name: Core Test Shard (${{ matrix.shard }})
    needs: seal
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [cap, mixed, share, latency]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - name: Verify sealed binaries and run assigned assertions without Cargo
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Shard -Shard '${{ matrix.shard }}' -SnapshotId '${{ needs.seal.outputs.snapshot_id }}' -SnapshotHash '${{ needs.seal.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-core-${{ needs.seal.outputs.snapshot_id }}-${{ matrix.shard }}
          path: build/parallel/core-${{ matrix.shard }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed shard receipts and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-core-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  aggregate:
    name: Aggregate Evidence
    needs: [seal, verify, core-tests]
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-verify-${{ needs.seal.outputs.snapshot_id }}-*
          merge-multiple: true
          path: build/parallel/evidence-download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-core-${{ needs.seal.outputs.snapshot_id }}-*
          merge-multiple: true
          path: build/parallel/evidence-download
      - name: Extract verification evidence
        run: |
          foreach ($file in Get-ChildItem build/parallel/evidence-download -Filter *.tar) {
            tar -xf $file.FullName
            if ($LASTEXITCODE) { throw 'Evidence extraction failed.' }
          }
      - name: Validate exact coverage and issue packaging permit
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Aggregate -SnapshotId '${{ needs.seal.outputs.snapshot_id }}' -SnapshotHash '${{ needs.seal.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-evidence-${{ needs.seal.outputs.snapshot_id }}
          path: build/parallel/evidence.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed aggregation logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-aggregation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  package:
    name: Package & Verify
    needs: [seal, aggregate]
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_name: windows-package-parallel-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-evidence-${{ needs.seal.outputs.snapshot_id }}
          path: build/parallel/evidence-download
      - name: Extract accepted evidence
        run: |
          tar -xf build/parallel/evidence-download/evidence.tar
          if ($LASTEXITCODE) { throw 'Evidence extraction failed.' }
      - name: Revalidate permit, package sealed inputs and verify installer hash
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Package -SnapshotId '${{ needs.seal.outputs.snapshot_id }}' -SnapshotHash '${{ needs.seal.outputs.snapshot_sha256 }}'
      - name: Retain final acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-ctest-parallel-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 14
      - name: Build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-package-parallel-${{ github.run_attempt }}
          path: |
            dist/Shanjie-Windows-Setup.exe
            dist/Shanjie-Windows-Setup.exe.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: release
    if: needs.release.outputs.build_linux == 'true'
    runs-on: ubuntu-latest
    # Linux 版的目標是 Fedora 44 GNOME；在同版容器建置，GTK 4／libadwaita 與 glibc 和使用者一致。
    container: fedora:44
    outputs:
      artifact_name: linux-package-${{ github.run_attempt }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y git gh rust cargo gcc pkgconf-pkg-config gtk4-devel libadwaita-devel \
            https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-1.rh.x86_64.rpm
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - name: Cache upstream models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: build/model
          key: models-${{ hashFiles('MODEL-SOURCES.json') }}
      - name: Build the package
        run: linux/scripts/package.sh
      - name: Prepare verified release assets
        run: |
          python3 scripts/release.py manifest --platform linux --folder build/linux/dist
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: linux-package-${{ github.run_attempt }}
          path: |
            build/linux/dist/shanjie-linux-*.tar.gz
            build/linux/dist/shanjie-linux-*.tar.gz.sha256
            build/linux/dist/release-source.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release, windows, package, linux]
    if: >-
      ${{ always() && needs.release.outputs.publish == 'true' &&
          (needs.windows.result == 'success' || needs.package.result == 'success') &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.package.outputs.artifact_name || needs.windows.outputs.artifact_name }}
          path: build/release-assets/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.release.outputs.build_linux == 'true'
        with:
          name: ${{ needs.linux.outputs.artifact_name }}
          path: build/release-assets/linux
      - name: Resume and publish only a complete same-source draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --folder build/release-assets
