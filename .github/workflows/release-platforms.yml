name: Platform Release

on:
  workflow_call:
    inputs:
      build_linux:
        description: Include the optional Linux package
        type: boolean
        required: true
      publish:
        description: Publication decision from the release plan
        type: boolean
        required: true
    outputs:
      artifact_name:
        description: Verified Windows installer artifact
        value: ${{ jobs.release-ready.outputs.artifact_name }}
      linux_artifact_name:
        description: Verified Linux package artifact when enabled
        value: ${{ jobs.release-ready.outputs.linux_artifact_name }}
      publish:
        description: Publication decision after release readiness
        value: ${{ jobs.release-ready.outputs.publish }}
      build_linux:
        description: Whether Linux assets are required
        value: ${{ jobs.release-ready.outputs.build_linux }}

permissions:
  contents: read

jobs:
  build-x64:
    name: Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-build-x64-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: build
          architecture: x64
      - name: Build x64, WinUI and shared data
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Build -Architecture x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/build-x64.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  build-x86:
    name: Windows x86
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-build-x86-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: build
          architecture: x86
      - name: Build x86 product and recovery probe
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Build -Architecture x86
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/build-x86.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  prepare-core:
    name: Windows Core
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-core-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: core
      - name: Compile core tests
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase PrepareCore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-core-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/core-bundle.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  seal:
    name: Snapshot
    needs: [build-x64, build-x86, prepare-core]
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    outputs:
      snapshot_id: ${{ steps.seal.outputs.snapshot_id }}
      snapshot_sha256: ${{ steps.seal.outputs.snapshot_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-x64.outputs.artifact }}
          path: build/parallel/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-x86.outputs.artifact }}
          path: build/parallel/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.prepare-core.outputs.artifact }}
          path: build/parallel/transfer
      - name: Extract build artifacts
        run: |
          python scripts/release_artifacts.py unpack build/parallel/transfer/build-x64.tar --root .
          if ($LASTEXITCODE) { throw 'x64 extraction failed.' }
          python scripts/release_artifacts.py unpack build/parallel/transfer/build-x86.tar --root .
          if ($LASTEXITCODE) { throw 'x86 extraction failed.' }
          python scripts/release_artifacts.py unpack build/parallel/transfer/core-bundle.tar --root build/parallel
          if ($LASTEXITCODE) { throw 'Core bundle extraction failed.' }
      - name: Verify source receipts and seal common snapshot
        id: seal
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-snapshot-${{ steps.seal.outputs.snapshot_id }}
          path: build/parallel/snapshot.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  verify:
    name: CTest ${{ matrix.architecture }}
    needs: seal
    outputs:
      snapshot_id: ${{ needs.seal.outputs.snapshot_id }}
      snapshot_sha256: ${{ needs.seal.outputs.snapshot_sha256 }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        architecture: [x64, x86]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: verify
          architecture: ${{ matrix.architecture }}
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - name: Run CTest
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Verify -Architecture '${{ matrix.architecture }}' -SnapshotId '${{ needs.seal.outputs.snapshot_id }}' -SnapshotHash '${{ needs.seal.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-verify-${{ needs.seal.outputs.snapshot_id }}-${{ matrix.architecture }}
          path: build/parallel/verify-${{ matrix.architecture }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed verification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-verify-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  core-tests:
    name: Core ${{ matrix.shard }}
    needs: seal
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [cap, mixed, share, latency]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - name: Run core shard
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Shard -Shard '${{ matrix.shard }}' -SnapshotId '${{ needs.seal.outputs.snapshot_id }}' -SnapshotHash '${{ needs.seal.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-core-${{ needs.seal.outputs.snapshot_id }}-${{ matrix.shard }}
          path: build/parallel/core-${{ matrix.shard }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed shard receipts and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-core-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  aggregate:
    name: CTest Merge
    needs: [verify, core-tests]
    outputs:
      snapshot_id: ${{ needs.verify.outputs.snapshot_id }}
      snapshot_sha256: ${{ needs.verify.outputs.snapshot_sha256 }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.verify.outputs.snapshot_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-verify-${{ needs.verify.outputs.snapshot_id }}-*
          merge-multiple: true
          path: build/parallel/evidence-download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-core-${{ needs.verify.outputs.snapshot_id }}-*
          merge-multiple: true
          path: build/parallel/evidence-download
      - name: Extract verification evidence
        run: |
          foreach ($file in Get-ChildItem build/parallel/evidence-download -Filter *.tar) {
            python scripts/release_artifacts.py unpack $file.FullName --root .
            if ($LASTEXITCODE) { throw 'Evidence extraction failed.' }
          }
      - name: Verify core receipts
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Aggregate -SnapshotId '${{ needs.verify.outputs.snapshot_id }}' -SnapshotHash '${{ needs.verify.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-evidence-${{ needs.verify.outputs.snapshot_id }}
          path: build/parallel/evidence.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed aggregation logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-aggregation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  package:
    name: CTest Package
    needs: aggregate
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_name: windows-package-parallel-${{ github.run_attempt }}
      publish: ${{ inputs.publish }}
      build_linux: ${{ inputs.build_linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.aggregate.outputs.snapshot_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-evidence-${{ needs.aggregate.outputs.snapshot_id }}
          path: build/parallel/evidence-download
      - name: Extract accepted evidence
        run: |
          python scripts/release_artifacts.py unpack build/parallel/evidence-download/evidence.tar --root .
          if ($LASTEXITCODE) { throw 'Evidence extraction failed.' }
      - name: Package and verify
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Package -SnapshotId '${{ needs.aggregate.outputs.snapshot_id }}' -SnapshotHash '${{ needs.aggregate.outputs.snapshot_sha256 }}'
      - name: Retain final acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-ctest-parallel-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 14
      - name: Build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-package-parallel-${{ github.run_attempt }}
          path: |
            dist/Shanjie-Windows-Setup.exe
            dist/Shanjie-Windows-Setup.exe.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7

  release-ready:
    name: Release Ready
    needs: [package, linux-package]
    if: >-
      ${{ always() && needs.package.result == 'success' &&
          ((inputs.build_linux && needs.linux-package.result == 'success') ||
           (!inputs.build_linux && needs.linux-package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ needs.package.outputs.artifact_name }}
      linux_artifact_name: ${{ needs.linux-package.outputs.artifact_name }}
      publish: ${{ needs.package.outputs.publish }}
      build_linux: ${{ needs.package.outputs.build_linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: build/release-ready/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.build_linux
        with:
          name: ${{ needs.linux-package.outputs.artifact_name }}
          path: build/release-ready/linux
      - name: Check required release assets
        run: python3 scripts/release.py check --folder build/release-ready

  linux:
    name: Linux
    if: inputs.build_linux
    runs-on: ubuntu-latest
    # Linux 版的目標是 Fedora 44 GNOME；在同版容器建置，GTK 4／libadwaita 與 glibc 和使用者一致。
    container: fedora:44
    outputs:
      build_artifact: linux-inputs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y git gh rust cargo gcc cmake make pkgconf-pkg-config gtk4-devel libadwaita-devel ibus python3-gobject dbus-daemon \
            https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-1.rh.x86_64.rpm
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - name: Cache upstream models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: build/model
          key: models-${{ hashFiles('MODEL-SOURCES.json') }}
      - name: Build Linux payload
        run: |
          linux/scripts/build.sh build/linux/payload
          install -m644 linux/package/README.txt build/linux/payload/
          python3 scripts/release_artifacts.py pack build/linux/inputs.tar --root . --paths build/linux/payload build/core build/linux/target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/linux/inputs.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  linux-ctest:
    name: Linux CTest
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:44
    outputs:
      tested_artifact: linux-tested-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Install test tools
        run: |
          dnf install -y git rust cargo gcc cmake make pkgconf-pkg-config gtk4-devel libadwaita-devel ibus python3-gobject dbus-daemon
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.linux.outputs.build_artifact }}
          path: build/linux/transfer
      - name: Restore Linux inputs
        run: python3 scripts/release_artifacts.py unpack build/linux/transfer/inputs.tar --root .
      - name: Run Linux CTest
        run: bash linux/scripts/test.sh build/linux/payload
      - name: Upload Linux test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/linux-*/junit.xml
            build/reports/linux-*/ctest.log
            build/reports/linux-*/inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Transfer accepted Linux payload
        run: |
          report=$(python3 -c 'import json; print(json.load(open("build/linux/tested.json"))["report"])')
          python3 scripts/release_artifacts.py pack build/linux/tested.tar --root . --paths build/linux/payload build/linux/tested.json "$report/inventory.json" "$report/junit.xml" "$report/ctest.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-tested-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/linux/tested.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  linux-package:
    name: Linux Package
    needs: linux-ctest
    runs-on: ubuntu-latest
    outputs:
      artifact_name: linux-package-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.linux-ctest.outputs.tested_artifact }}
          path: build/linux/transfer
      - name: Restore tested Linux payload
        run: python3 scripts/release_artifacts.py unpack build/linux/transfer/tested.tar --root .
      - name: Package accepted payload
        run: bash linux/scripts/package.sh --tested build/linux/payload build/linux/tested.json
      - name: Prepare verified release assets
        run: |
          python3 scripts/release.py manifest --platform linux --folder build/linux/dist
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: linux-package-${{ github.run_attempt }}
          path: |
            build/linux/dist/shanjie-linux-*.tar.gz
            build/linux/dist/shanjie-linux-*.tar.gz.sha256
            build/linux/dist/release-source.json
          if-no-files-found: error
          retention-days: 7
